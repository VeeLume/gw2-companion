[package]
name = "gw2-companion-app"
version = "0.1.0"
description = "A companion app for Guild Wars 2"
authors = ["Veelume"]
edition = "2024"
# Required because a second [[bin]] (export-bindings) is declared below: without
# it `cargo run` cannot choose a target, and `tauri dev`'s DevCommand is a bare
# `cargo run`.
default-run = "gw2-companion-app"

[[bin]]
name = "gw2-companion-app"
path = "src/main.rs"

# Dev-only bindings exporter. Behind a non-default feature so `cargo build` and
# `tauri build` skip it — Tauri compiles every [[bin]] and bundles it into the
# installer otherwise (tauri-apps/tauri#7592).
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindgen"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gw2_companion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bindgen = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
gw2-api = { workspace = true }
gw2-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# Typed IPC: every #[specta::specta] command is exported to src/lib/bindings.ts
# on debug builds. Pinned — the rc versions of these three must agree.
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# Desktop-only: the signed auto-updater and the relaunch that follows it.
# Mobile has no Tauri updater (Android ships its own APK flow).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
